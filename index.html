<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연차 사용 현황 조회</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <section class="card">
      <div class="topbar">
        <div class="title-wrap">
          <h1>연차 사용 현황 조회</h1>
          <p>이름과 주민등록번호 앞 6자리로 연차 현황과 사용 내역을 확인합니다.</p>
        </div>
        <div class="nav">
          <a href="admin.html">관리자 입력 페이지</a>
        </div>
      </div>
    </section>

    <section class="card">
      <div id="message" class="message hidden"></div>
      <form id="searchForm" class="grid-2">
        <div>
          <label for="name">이름</label>
          <input id="name" type="text" placeholder="예: 홍길동" required />
        </div>
        <div>
          <label for="rrnFront">주민등록번호 앞자리</label>
          <input id="rrnFront" type="password" maxlength="6" placeholder="생년월일 6자리" required />
        </div>
        <div class="button-row">
          <button type="submit">조회하기</button>
        </div>
      </form>
      <p class="note">이 버전은 순수 HTML + JS 방식이며, 데이터는 브라우저 localStorage에 저장됩니다. 일반 연차는 1일, 반일 연차는 0.5일 차감되며 생일 연차와 공가 연차는 차감되지 않습니다.</p>
    </section>

    <section id="resultSection" class="hidden">
      <section class="card">
        <div class="grid-3">
          <div class="stat"><div class="label">총 연차</div><div class="value" id="totalLeave">0일</div></div>
          <div class="stat"><div class="label">사용 연차</div><div class="value" id="usedLeave">0일</div></div>
          <div class="stat"><div class="label">잔여 연차</div><div class="value" id="remainingLeave">0일</div></div>
        </div>
      </section>

      <section class="card">
        <div class="topbar">
          <h2>직원 정보</h2>
          <span class="badge" id="historyCount">0건</span>
        </div>
        <div class="grid-3">
          <div class="stat"><div class="label">이름</div><div class="value" id="employeeName" style="font-size:22px;">-</div></div>
          <div class="stat"><div class="label">부서</div><div class="value" id="employeeDepartment" style="font-size:22px;">-</div></div>
          <div class="stat"><div class="label">입사일</div><div class="value" id="employeeHireDate" style="font-size:22px;">-</div></div>
        </div>
      </section>

      <section class="card">
        <h2>연차 사용 내역</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>사용일</th><th>종류</th><th>차감일수</th><th>사유</th></tr>
            </thead>
            <tbody id="historyBody"><tr><td colspan="4">조회 결과가 없습니다.</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </div>

  <script src="storage.js"></script>
  <script>
    LeaveStore.seedStoreIfNeeded();
    const form = document.getElementById('searchForm');
    const resultSection = document.getElementById('resultSection');
    const messageBox = document.getElementById('message');
    const historyBody = document.getElementById('historyBody');

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = 'message ' + type;
    }
    function hideMessage() {
      messageBox.className = 'message hidden';
      messageBox.textContent = '';
    }
    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      hideMessage();
      resultSection.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const rrnFront = document.getElementById('rrnFront').value.trim();
      if (!name || !rrnFront) return showMessage('이름과 주민등록번호 앞자리를 입력해주세요.', 'error');
      if (!/^\d{6}$/.test(rrnFront)) return showMessage('주민등록번호 앞자리는 숫자 6자리여야 합니다.', 'error');

      const store = LeaveStore.loadStore();
      const employee = LeaveStore.findEmployee(name, rrnFront, store);
      if (!employee) return showMessage('일치하는 직원 정보가 없습니다.', 'error');

      const summary = LeaveStore.getEmployeeSummary(store, employee);
      const history = LeaveStore.getHistoriesByEmployeeId(employee.id, store);

      setText('totalLeave', summary.annualLeaveTotal + '일');
      setText('usedLeave', summary.annualLeaveUsed + '일');
      setText('remainingLeave', summary.annualLeaveRemaining + '일');
      setText('employeeName', summary.name || '-');
      setText('employeeDepartment', summary.department || '-');
      setText('employeeHireDate', summary.hireDate || '-');
      setText('historyCount', history.length + '건');

      historyBody.innerHTML = history.length ? history.map(function (item) {
        return '<tr><td>' + (item.leaveDate || '-') + '</td><td>' + (item.leaveType || '-') + '</td><td>' + Number(item.daysUsed || 0) + '일</td><td>' + (item.reason || '-') + '</td></tr>';
      }).join('') : '<tr><td colspan="4">사용 내역이 없습니다.</td></tr>';

      resultSection.classList.remove('hidden');
      showMessage('연차 정보를 조회했습니다.', 'success');
    });
  </script>
</body>
</html>
